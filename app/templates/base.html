<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}DevOpsMart{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<header>
    <div class="container navbar">

        <a href="/" class="logo">
            DevOpsMart
        </a>

        <nav>
            <a href="/">Home</a>
            <a href="/products">Products</a>
            <a href="/health">Health</a>
        </nav>

    </div>
</header>

<main class="container">
    {% block content %}
    {% endblock %}
</main>

<footer>
    <p>DevOpsMart — DevOps Practice Application</p>
</footer>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
